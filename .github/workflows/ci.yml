name: Verify toolkit (no MikroTik binaries)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import pinned upstream metadata (text; not executed)
        run: python scripts/import_upstream.py
      - name: Verify patch engine with synthetic fixtures only
        run: python -m unittest discover -s tests -v
      - name: Verify release package contains no executable
        run: python scripts/package_release.py --tag ci --output dist/ci-source-only.zip

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse toolkit using Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('WinBox-Toolkit.ps1',)) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
          }
          Write-Host 'PowerShell syntax: PASS (not a Windows runtime/RouterOS test)'
